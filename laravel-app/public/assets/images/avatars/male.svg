<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Profile picture, male">
  <rect width="200" height="200" fill="#ffffff"/>
  <!-- ears -->
  <ellipse cx="58" cy="86" rx="7" ry="13" fill="#cfd2d6"/>
  <ellipse cx="142" cy="86" rx="7" ry="13" fill="#cfd2d6"/>
  <!-- neck, thick enough to match a man's shoulders -->
  <rect x="82" y="108" width="36" height="40" rx="8" fill="#cfd2d6"/>
