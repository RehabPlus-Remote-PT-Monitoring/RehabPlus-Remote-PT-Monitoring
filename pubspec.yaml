name: rehabplus
description: "Camera-Assisted Remote Physical Therapy Monitoring System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.12.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  intl: ^0.19.0
  phosphor_flutter: ^2.0.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  permission_handler: ^11.3.0
  vibration: ^2.0.0
  audioplayers: ^6.0.0
  # Added for better performance and debugging
  collection: ^1.18.0
  meta: ^1.12.0
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  url_launcher: ^6.3.3
  firebase_messaging: ^17.0.0
  image_picker: ^1.2.4
  flutter_tts: ^4.2.5
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  package_info_plus: ^9.0.1
  path_provider: ^2.1.6
  # Settings > App lock: fingerprint/face prompt, Keystore-encrypted storage
  # for the PIN hash, and SHA-256 for hashing it (lib/services/app_lock_service.dart)
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.4
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Added for better testing and analysis
  integration_test:
    sdk: flutter
  # Generates launcher icons for every platform from assets/icon/ (config: flutter_launcher_icons.yaml)
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/successSound.mp3
    - assets/legal/