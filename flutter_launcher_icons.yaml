# App icon config. The icon (white R with a blue shield badge on teal) is drawn by
# tool/make_icon.py. To change it:
#   1. Edit and run: python3 tool/make_icon.py  (writes assets/icon/app_icon.png,
#      opaque 1024x1024, and app_icon_foreground.png, transparent mark for
#      Android adaptive icons; Android insets it 16% and crops to circle/squircle)
#   2. Update adaptive_icon_background below if the background color changes
#   3. Run: dart run flutter_launcher_icons
#   5. git checkout ios/Runner.xcodeproj/project.pbxproj  (v0.14.4 bug wrongly
#      sets ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = AppIcon)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#1E8E92"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#1E8E92"
    theme_color: "#00BCD4"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
