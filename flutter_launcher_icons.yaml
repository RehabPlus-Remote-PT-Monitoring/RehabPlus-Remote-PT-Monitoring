# App icon config. To change the icon:
#   1. Replace assets/icon/app_icon.png (1024x1024, square, NO transparency)
#   2. Replace assets/icon/app_icon_foreground.png (1024x1024, transparent PNG
#      of just the logo mark; Android insets it 16% and crops to circle/squircle)
#   3. Update adaptive_icon_background below if the brand color changes
#   4. Run: dart run flutter_launcher_icons
#   5. git checkout ios/Runner.xcodeproj/project.pbxproj  (v0.14.4 bug wrongly
#      sets ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS = AppIcon)
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#00ACC1"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#00BCD4"
    theme_color: "#00BCD4"

  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
